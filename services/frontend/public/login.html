<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Upcycle Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0A0C10;
      --glass-bg: rgba(20, 24, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #00FF88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --text-main: #FFFFFF;
      --text-muted: #8E9BAE;
      --danger: #FF3366;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      min-height: 100vh;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }
    
    .bg-texture {
      position: fixed; inset: 0; z-index: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.08) 0%, transparent 50%);
      filter: blur(40px);
    }
    
    .card {
      position: relative; z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    @keyframes floatIn {
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo span {
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
    }
    
    .tagline { 
      font-size: 14px; 
      color: var(--text-muted); 
      margin-bottom: 36px; 
      line-height: 1.5;
    }
    
    label { 
      display: block; 
      font-size: 13px; 
      font-weight: 500; 
      margin-bottom: 8px; 
      color: var(--text-muted); 
      letter-spacing: 0.5px; 
      text-transform: uppercase;
    }
    
    input {
      width: 100%; 
      padding: 14px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--text-main);
      margin-bottom: 20px;
      transition: all 0.3s ease;
      outline: none;
    }
    
    input::placeholder { color: rgba(255,255,255,0.2); }
    
    input:focus { 
      border-color: var(--accent); 
      background: rgba(0,0,0,0.5);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
    }
    
    .btn {
      width: 100%; 
      padding: 15px;
      background: var(--accent);
      color: var(--bg-dark);
      border: none; 
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px; 
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    
    .btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
    
    .err { 
      color: var(--danger); 
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid rgba(255, 51, 102, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px; 
      margin-bottom: 20px; 
      display: none; 
      text-align: center;
    }
    
    .footer-link { 
      text-align: center; 
      margin-top: 24px; 
      font-size: 14px; 
      color: var(--text-muted); 
    }
    
    .footer-link a { 
      color: var(--accent); 
      text-decoration: none; 
      font-weight: 600; 
      transition: text-shadow 0.2s;
    }
    
    .footer-link a:hover {
      text-shadow: 0 0 10px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="bg-texture"></div>
  <div class="card">
    <div class="logo">♻ <span>Upcycle</span></div>
    <div class="tagline">Marketplace produk daur ulang terbaik di era modern.</div>
    <div id="err" class="err"></div>
    
    <label>Email Address</label>
    <input type="email" id="email" placeholder="kamu@email.com" />
    
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />
    
    <button class="btn" id="loginBtn" onclick="doLogin()">Autentikasi Aman</button>
    
    <div class="footer-link">Belum punya akses? <a href="/register.html">Daftar sekarang</a></div>
  </div>

  <script src="/config.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      const role = localStorage.getItem('role');
      window.location.href = role === 'admin' ? '/admin.html' : '/katalog.html';
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      const btn = document.getElementById('loginBtn');
      errEl.style.display = 'none';
      if (!email || !password) { errEl.textContent = 'Email dan password wajib diisi'; errEl.style.display = 'block'; return; }
      
      btn.disabled = true; btn.textContent = 'Memverifikasi...';
      try {
        const res = await api.post(`${CONFIG.AUTH_URL}/login`, { email, password });
        if(!res) {
            errEl.textContent = 'Autentikasi ditolak.';
            errEl.style.display = 'block';
            return;
        }
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.message; errEl.style.display = 'block'; return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('role', data.role);
        window.location.href = data.role === 'admin' ? '/admin.html' : '/katalog.html';
      } catch { errEl.textContent = 'Gagal terhubung ke server utama'; errEl.style.display = 'block'; }
      finally { btn.disabled = false; btn.textContent = 'Autentikasi Aman'; }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
